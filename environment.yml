# Conda / mamba environment for HIVE.
#
#   conda env create -f environment.yml      (run from this folder)
#   conda activate hive
#   streamlit run app.py
#
# The packages themselves come from requirements.txt, so there is one list to maintain.
name: hive
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - -r requirements.txt
