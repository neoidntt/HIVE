name: Build launcher

# Builds HIVE.exe, the double-click launcher for Windows, from launch_hive.py.
#
# * Pushing a tag that starts with v (for example v0.0.3) builds it, checks that it
#   installs HIVE's libraries and then skips the install on a second run, and publishes a
#   GitHub release with HIVE.exe attached.
# * Run it by hand (Actions tab > Build launcher > Run workflow) to build without releasing;
#   the file is then attached to the run as an artifact.
# The file is not signed, so Windows SmartScreen may warn the first time.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pillow
      - run: python packaging/build_exe.py
      - name: Smoke test - first start installs the libraries
        shell: bash
        run: ./HIVE.exe --setup-only
      - name: Smoke test - second start finds them and skips the install
        shell: bash
        run: ./HIVE.exe --setup-only | tee second.log && grep -q "Environment is ready" second.log
      - uses: actions/upload-artifact@v4
        with:
          name: HIVE-launcher-windows
          path: HIVE.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" HIVE.exe \
            --verify-tag --title "HIVE ${GITHUB_REF_NAME#v}" \
            --notes "Double-click HIVE.exe inside the HIVE folder (next to app.py). The first start installs the libraries it needs; later starts just open the app. The file is unsigned, so Windows may show an unknown-publisher warning: choose More info, then Run anyway. See the README for what is new and what was not verified."
