# HIVE Streamlit configuration.
[server]
# Max upload size in MB. Default is 200; raised to 1 GB for large microscopy files.
# Uploads are held in RAM by Streamlit (there is no streaming-to-disk option), so raising
# this much further would let one upload use up the computer's memory and kill the app.
# Files larger than about 1 GB should NOT be uploaded: choose "File or folder on this
# computer" in the sidebar instead. That reads the file where it is, with no size limit.
maxUploadSize = 1000

[browser]
# Don't phone home with usage stats.
gatherUsageStats = false

# NOTE: no [theme] section on purpose. With no theme pinned, Streamlit follows the
# system light/dark setting by default AND leaves the theme switcher available
# (top-right menu > Settings > Appearance: Light / Dark / Use system setting).
# Pinning a theme here is what previously locked the mode. Branding accents are
# applied via theme-aware CSS in app.py instead, so controls stay readable in both.
